version: 2
updates:
  # Обновления группируются в один PR на экосистему, чтобы не заваливать список
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-pip:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Go для агента меняется только вместе с agent-signing/release.py и новым подписанным
    # релизом агента: PR на один Dockerfile разводит бинарь панели и подписанный по sha256
    ignore:
      - dependency-name: golang
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-docker:
        patterns: ["*"]
