name: Audit

# Уязвимости в закрепленных зависимостях. CI проверяет их на push и PR, но lock без коммитов
# не меняется, а база уязвимостей пополняется: раз в неделю проверяем то, что уже в main.
on:
  schedule:
    - cron: "17 5 * * 1" # понедельник, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # pip-audit - из того же dev-lock, что в CI
      - name: Install
        run: |
          pip install --require-hashes --no-deps --only-binary :all: -r requirements-dev.txt
      - name: Dependency audit (pip-audit)
        run: pip-audit --disable-pip --require-hashes -r requirements.txt -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency audit (npm audit)
        run: npm run audit:build
