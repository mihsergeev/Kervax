name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"] # минимальная версия и версия runtime-образа
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .[dev]
      - name: Tests
        run: pytest -q -n auto
      # Реальные uid/права/симлинки: установщик пишет только в изолированное дерево теста.
      - name: Backup installer security regression
        run: sudo env PATH="$PATH" "$(command -v python)" -m pytest --noconftest -q tests/test_backup_dump_paths_security.py
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit

  # Миграции и PostgreSQL. Тесты выше идут на SQLite через create_all: миграция, которая не
  # накатывается на PG, и расхождение моделей со схемой всплывали только на проде, где
  # backend уходил в цикл перезапусков на "alembic upgrade head". Здесь: накат с нуля,
  # сверка моделей со схемой, откат последней и накат обратно, и часть тестов на PG.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kervax
          POSTGRES_USER: kervax
          POSTGRES_PASSWORD: kervax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kervax"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      KERVAX_DB_URL: postgresql+asyncpg://kervax:kervax@localhost:5432/kervax
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: pip install .[dev]
      - name: Upgrade from scratch
        run: alembic upgrade head
      - name: Models match the schema
        run: alembic check
      - name: Downgrade one and upgrade again
        run: alembic downgrade -1 && alembic upgrade head
      - name: Tests on PostgreSQL
        env:
          KERVAX_TEST_PG: postgresql+asyncpg://kervax:kervax@localhost:5432/kervax_tests
        run: |
          PGPASSWORD=kervax psql -h localhost -U kervax -d kervax -c 'create database kervax_tests'
          pytest -q tests/test_backup.py tests/test_auth.py tests/test_users.py tests/test_checks.py tests/test_servers.py tests/test_maint.py tests/test_check_edit_roundtrip.py tests/test_audit_view.py tests/test_home_mute.py tests/test_api_scope_regressions.py

  # Проверка «панель не молчит»: рядом с кодом живут списки, написанные руками
  # (виды алертов, подписи helper'ов, разделы, переводы). Код уходит вперёд —
  # панель не ругается, а тихо перестаёт что-то показывать. Ловим машинно.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Consistency selfcheck
        run: python ops/selfcheck.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  # Агент собирается и проверяется отдельно: он не в образе панели, а логика
  # самообновления живёт только здесь. Ошибку в ней видно не при сборке, а через
  # неделю — «нода не обновляется», и разбираться приходится на чужом канале.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false # агент не имеет внешних модулей и go.sum
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -o /dev/null .

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: backend/Dockerfile
            context: .
          - image: frontend
            dockerfile: frontend/Dockerfile
            context: ./frontend
    steps:
      - uses: actions/checkout@v7
      # Контекст — КОРЕНЬ репозитория, а не backend/: образ бэкенда собирает ещё
      # и Go-агента (agent/main.go) и подхватывает подписанный манифест из
      # agent-dist/. С контекстом ./backend сборка падает на первом же COPY.
      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "kervax-${{ matrix.image }}" "${{ matrix.context }}"
      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kervax-${{ matrix.image }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
