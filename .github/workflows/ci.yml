name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .[dev]
      - name: Tests
        run: pytest -q
      - name: Dependency audit (pip-audit)
        continue-on-error: true # информативно, не блокирует
        run: |
          pip install pip-audit
          pip-audit

  # Проверка «панель не молчит»: рядом с кодом живут списки, написанные руками
  # (виды алертов, подписи helper'ов, разделы, переводы). Код уходит вперёд —
  # панель не ругается, а тихо перестаёт что-то показывать. Ловим машинно.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Consistency selfcheck
        run: python ops/selfcheck.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        run: npm ci
      - name: Dependency audit (npm audit)
        continue-on-error: true # информативно, не блокирует
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  # Агент собирается и проверяется отдельно: он не в образе панели, а логика
  # самообновления живёт только здесь. Ошибку в ней видно не при сборке, а через
  # неделю — «нода не обновляется», и разбираться приходится на чужом канале.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build
        run: go build -o /dev/null .

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Контекст — КОРЕНЬ репозитория, а не backend/: образ бэкенда собирает ещё
      # и Go-агента (agent/main.go) и подхватывает подписанный манифест из
      # agent-dist/. С контекстом ./backend сборка падает на первом же COPY.
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t kervax-backend .
      - name: Trivy scan (backend image)
        continue-on-error: true # отчёт по CVE в образе, не блокирует
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kervax-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
