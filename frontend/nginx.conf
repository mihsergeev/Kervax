# Формат лога как combined плюс время ответа: без него не измерить, какой запрос тормозит
# (на /api/servers гоняется полный расчет по всем серверам на каждый опрос главной).
log_format kervax '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Успешный опрос команд агентом не пишем: каждый агент спрашивает раз в секунду, это
# девять десятых строк лога (117 тысяч в час на панели с тремя десятками серверов), и
# среди них ничего не найти. Ошибки и все остальные запросы пишутся как раньше.
map "$status:$uri" $kervax_loggable {
    "~^[23]\d\d:/api/agent/commands$" 0;
    default 1;
}

server {
    # 8080, а не 80: контейнер работает без root и порты ниже 1024 занять не может
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # не раскрываем версию nginx
    server_tokens off;

    access_log /var/log/nginx/access.log kervax if=$kervax_loggable;

    # Ответы API — это JSON со списками мониторов и метриками: на парке в
    # несколько сотен сайтов /checks/overview весит под полмегабайта, и по
    # медленному каналу это заметно дольше, чем сам запрос к базе.
    gzip on;
    # text/x-shellscript - установщик агента и helper'ы: сжатый (curl --compressed) установщик
    # меньше порога, на котором DPI на части каналов рвет соединение
    gzip_types application/json application/javascript text/css image/svg+xml text/x-shellscript;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    # Аутентификация — внутренняя (JWT + 2FA) в самой панели; сетевой доступ
    # ограничивается IP-whitelist'ом на реверс-прокси (Caddy).

    # запрет индексации поисковиками
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Заголовки безопасности. CSP: script только со своего origin (нет inline),
    # data: — для инлайновых SVG-иконок, unsafe-inline в style — для инлайновых
    # стилей React. Проверяется headless-хромом на реальной сборке (Этап 6).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS: игнорируется по HTTP (standalone), применяется когда впереди HTTPS-прокси
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Адрес бэкенда берём ПЕРЕМЕННОЙ, а не литералом. С литералом nginx
    # резолвит имя один раз при старте и держит адрес вечно; docker при
    # пересоздании контейнера выдаёт новый IP, и панель начинает отдавать
    # 502 — при живом и здоровом бэкенде. Ловится ровно на «docker compose
    # up -d backend» (обновили только бэкенд, фронт не трогали), который
    # советует и наша же инструкция. Переменная заставляет резолвить через
    # встроенный DNS docker (127.0.0.11) с коротким кэшем. Задана на уровне
    # server: вложенные location ниже ее тоже видят.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kervax_backend http://backend:8000;

    location /api/ {
        # $request_uri дописан явно: с переменной в proxy_pass путь стоит
        # передавать самому, иначе поведение зависит от версии nginx
        proxy_pass $kervax_backend$request_uri;
        # импорт бэкапа панели и чек-листов - несколько мегабайт
        client_max_body_size 25m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Запросы агентов. Сюда пускают с любого адреса, а тело распаковывается до проверки
        # токена, поэтому потолок тесный: отчет самой крупной ноды - сотня килобайт до сжатия,
        # 4 МБ хватает с запасом, а сжатая бомба такого размера уже не страшна.
        # Буфер 512к: отчет больше 16к по умолчанию, и nginx писал каждый второй во временный
        # файл (5,5 тысяч записей на диск в час и столько же предупреждений в логе).
        location /api/agent/ {
            proxy_pass $kervax_backend$request_uri;
            client_max_body_size 4m;
            client_body_buffer_size 512k;

            # Результат команды docker/kube (логи контейнера) агент шлет несжатым, до ~20 МБ
            location ~ ^/api/agent/(docker|kube)-result$ {
                proxy_pass $kervax_backend$request_uri;
                client_max_body_size 25m;
            }
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
