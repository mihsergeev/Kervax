# Optional override for deployments that use caddy-docker-proxy for edge TLS
# + IP allow-list. Requires an external Docker network named "caddy" created by
# a running caddy-docker-proxy instance.
#
#   docker compose -f compose.yml -f compose.caddy.yml up -d --build
#
# or set COMPOSE_FILE=compose.yml:compose.caddy.yml in your .env.
#
# Set KERVAX_DOMAIN and KERVAX_ALLOW_IPS in .env. To disable the IP allow-list,
# remove the @denied / abort labels below.
services:
  backend:
    environment:
      # Whose X-Forwarded-For the panel trusts (backend/app/client_ip.py). "private" strips
      # exactly one private hop - caddy in the docker network - and takes the address caddy
      # wrote before it, a LAN client included. The frontend port is not published here, so
      # nothing else reaches nginx from outside docker. A neighbouring container in the
      # caddy network could still claim another address, so the login allow-list does not
      # apply to it. A fresh agent_proxy_peers.json snapshot (docs/agent-source-guard.md)
      # or caddy's exact address in KERVAX_TRUSTED_PROXIES (it changes when caddy is
      # recreated) makes the address exact and the allow-list work. Not the whole caddy
      # subnet: that trusts every neighbour in it.
      # ":-": an empty value keeps "private" too - with nothing trusted caddy itself would
      # become every client's address
      KERVAX_TRUSTED_PROXIES: ${KERVAX_TRUSTED_PROXIES:-private}
      # the frontend port is not published in this overlay (ports: !reset [] below)
      KERVAX_BIND: unpublished
      # the caddy network gateway: an IPv6 client of an IPv4-only caddy network arrives from it
      # through docker-proxy, so it is never taken as a client address
      KERVAX_PROXY_GATEWAY: ${KERVAX_PROXY_GATEWAY:-}

  frontend:
    # caddy proxies via the internal network — no host port needed, so drop
    # the base compose's published port (avoids a host port conflict).
    ports: !reset []
    networks:
      - internal
      - caddy
    labels:
      caddy: ${KERVAX_DOMAIN}
      # Two mutually-exclusive handle blocks (works the same on caddy-docker-proxy
      # 2.8 and 2.12, unlike suffixed not_N matchers):
      #  1) /api/agent/* is open to ANY IP — agents push metrics from monitored
      #     nodes whose addresses aren't in the admin allow-list; those endpoints
      #     authenticate with per-server tokens anyway.
      #  2) everything else is denied unless the client IP is in KERVAX_ALLOW_IPS.
      #     Left empty → "not in all IPs" denies no one = open (fail-open).
      #     The loopback is always allowed, and so is KERVAX_PROXY_GATEWAY - the
      #     gateway of the docker network caddy runs in. Docker publishes the port
      #     through its own proxy, so a local probe (an agent checking a whitelisted
      #     site from inside its own server) reaches caddy from that gateway and
      #     never from the loopback. Only that single address belongs here, never
      #     the whole 172.16.0.0/12: in an IPv4-only caddy network every IPv6 client
      #     arrives from the same gateway, so a range here opens the panel to anyone
      #     over IPv6, and it lets in every neighbouring container as well. Never
      #     caddy's `private_ranges` either - it covers 10/8 and 192.168/16, which
      #     on a corporate network means every neighbour gets in. quickstart writes
      #     the address; docs/install.md says how to set it by hand.
      caddy.handle_0: /api/agent/*
      caddy.handle_0.reverse_proxy: "{{upstreams 8080}}"
      caddy.handle_1.@denied.not.remote_ip: 127.0.0.1/32 ::1/128 ${KERVAX_PROXY_GATEWAY:-} ${KERVAX_ALLOW_IPS:-0.0.0.0/0 ::/0}
      caddy.handle_1.abort: "@denied"
      caddy.handle_1.reverse_proxy: "{{upstreams 8080}}"

networks:
  caddy:
    external: true
    # Name of the existing network your caddy-docker-proxy watches.
    # Override in .env if it isn't literally "caddy" (e.g. KERVAX_CADDY_NETWORK=web).
    name: ${KERVAX_CADDY_NETWORK:-caddy}
